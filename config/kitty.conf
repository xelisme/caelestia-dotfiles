# ===== Basic =====
font_family              JetBrains Mono Nerd Font
font_size                12.0
shell                    fish
cursor_shape             beam
cursor_beam_thickness    1.5
background_opacity       0.78
window_padding_width     15
confirm_os_window_close  0
scrollback_lines         10000
enable_audio_bell        no

foreground            #e2e5ef
background            #0c0e12
selection_foreground  #0c0e12
selection_background  #b2c8ec
url_color             #b2c8ec
cursor                #b2c8ec
cursor_text_color     #0c0e12

# ===== Tab bar =====
tab_bar_style          powerline
tab_powerline_style    round
tab_bar_edge           top
tab_bar_min_tabs       2
tab_bar_align          center
tab_bar_margin_height  4 4
tab_bar_margin_width   8
tab_title_max_length   32
tab_title_template     "{index} {title}"
active_tab_font_style  bold

active_tab_foreground    #d5e4ff
active_tab_background    #3e5373
inactive_tab_foreground  #a7abb4
inactive_tab_background  #1c2026
tab_bar_background       #0c0e12

# ===== Tabs keybinds =====
map alt+left   previous_tab
map alt+right  next_tab
map alt+t      new_tab
map alt+w      close_tab

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# ===== Splits =====
enabled_layouts splits:split_axis=horizontal

map ctrl+shift+o         launch --location=vsplit
map ctrl+shift+e	    launch --location=hsplit

map ctrl+alt+left   neighboring_window left
map ctrl+alt+right  neighboring_window right
map ctrl+alt+up     neighboring_window up
map ctrl+alt+down   neighboring_window down

map ctrl+alt+shift+left   resize_window narrower
map ctrl+alt+shift+right  resize_window wider
map ctrl+alt+shift+up     resize_window taller
map ctrl+alt+shift+down   resize_window shorter

map ctrl+shift+w close_window_with_confirmation

# window borders between splits
active_border_color   #b2c8ec
inactive_border_color #444850
draw_minimal_borders  yes

# ===== Selection / search =====
map ctrl+shift+a 
map ctrl+shift+f  search_scrollback

